name: Release

on:
  push:
    branches: [master]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # npm 11, which is the first to support npm's trusted publishing
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # The same gates a pull request passes. `changesets/action` publishes from
      # this job, so nothing else stands between a red master and npm.
      - run: npm run build
      - run: npm run type-check
      - run: npm run lint
      - run: npm run coverage
      # A published version cannot be replaced, so the tarball is checked before
      # one exists: `attw` for how the types resolve, `publint` for the manifest.
      - run: npm run check-package

      # Opens a "Version Packages" PR when changesets are pending; publishes to
      # npm when that PR is merged.
      - uses: changesets/action@v1
        with:
          publish: npm run release
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
