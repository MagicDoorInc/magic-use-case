name: Release

on:
  push:
    branches: [master]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # npm 11, which is the first to support npm's trusted publishing
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # The same gates a pull request passes. This job versions and publishes, so
      # nothing else stands between a red master and npm.
      - run: npm run build
      - run: npm run type-check
      - run: npm run lint
      - run: npm run coverage
      # A published version cannot be replaced, so the tarball is checked before
      # one exists: `attw` for how the types resolve, `publint` for the manifest.
      - run: npm run check-package

      - name: Version
        run: |
          if [ -z "$(find .changeset -name '*.md')" ]; then exit 0; fi
          npx changeset version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version Packages"
          git push origin HEAD:master

      - name: Publish
        run: |
          npm run release
          git push origin --tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
